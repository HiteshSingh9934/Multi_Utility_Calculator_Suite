# The same manifests as k8s/, but the images come from GitHub Container Registry instead of
# being built on your own computer. The CD pipeline (.github/workflows/ci.yml) publishes the
# images and then changes the newTag lines below to the new build; Argo CD sees that commit and
# rolls the cluster forward. OWNER is replaced by the pipeline with your GitHub user name
# (lower case); if you deploy by hand, replace it yourself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s
images:
  - name: calculator-app/gateway
    newName: ghcr.io/hiteshsingh9934/calculator-app/gateway
    newTag: sha-c871e45
  - name: calculator-app/calc-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/calc-service
    newTag: sha-c871e45
  - name: calculator-app/converter-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/converter-service
    newTag: sha-c871e45
  - name: calculator-app/finance-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/finance-service
    newTag: sha-c871e45
  - name: calculator-app/student-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/student-service
    newTag: sha-c871e45
  - name: calculator-app/math-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/math-service
    newTag: sha-c871e45
  - name: calculator-app/matrix-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/matrix-service
    newTag: sha-c871e45
  - name: calculator-app/solver-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/solver-service
    newTag: sha-c871e45
  - name: calculator-app/history-service
    newName: ghcr.io/hiteshsingh9934/calculator-app/history-service
    newTag: sha-c871e45
patches:
  # k8s/ says "imagePullPolicy: Never" (use the locally built image). A registry image must be pulled.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
