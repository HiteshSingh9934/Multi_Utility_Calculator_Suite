# Redis: math-service keeps finished graphs here for an hour.
# It's only a cache, so an emptyDir volume is enough: if the pod moves, graphs are just worked out again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: calc-suite
  labels:
    app: cache
    app.kubernetes.io/part-of: calculator-suite
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
        app.kubernetes.io/part-of: calculator-suite
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.8-alpine
          args: ["--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--protected-mode", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: calc-suite
  labels:
    app: cache
spec:
  selector:
    app: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
