# Optional: scale calc-service and math-service on CPU use.
# Needs metrics-server, which Docker Desktop doesn't include (see README, "Autoscaling").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: calc-service
  namespace: calc-suite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calc-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
# math-service does the heavy work (3D graphs, calculus), so it can grow further
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: math-service
  namespace: calc-suite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: math-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # wait 2 minutes of low load before removing pods
