# gateway: Nginx serves the web page and routes /api/... to the services.
# The NodePort Service publishes it on http://localhost:30080 in Docker Desktop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: calc-suite
  labels:
    app: gateway
    app.kubernetes.io/part-of: calculator-suite
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: calculator-suite
    spec:
      enableServiceLinks: false   # no automatic SERVICE_PORT=tcp://... variables; config comes from app-config
      containers:
        - name: gateway
          image: calculator-app/gateway:3.2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DNS_SUFFIX
              valueFrom:
                configMapKeyRef: {name: app-config, key: DNS_SUFFIX}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: calc-suite
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
