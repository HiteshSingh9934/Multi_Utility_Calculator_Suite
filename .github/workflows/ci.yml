# CI and CD for the Calculator Suite: GitHub runs this on every push, tag and pull request.
#
#   CI  1. Unit tests       the microservices' code, without Docker
#       2. Lint             Dockerfiles (hadolint), Kubernetes manifests (kubeconform), the Compose file,
#                           and a Trivy scan of the configuration files (report only)
#       3. Build and test   build every image, start the whole app, run the end-to-end smoke test
#   CD  4. Publish          for each of the 9 images: build, scan with Trivy (stop on a CRITICAL
#                           vulnerability that has a fix), then push to GitHub Container Registry
#                           (ghcr.io) with an SBOM. Only for pushes to main and for v* tags.
#       5. GitOps           write the new image tag into deploy/overlays/ghcr and commit it;
#                           Argo CD sees the commit and updates the cluster (see deploy/README.md)
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install the test requirements
        run: pip install -r tests/requirements.txt
      - name: Run the unit tests
        run: python -m pytest -q tests/unit

  lint:
    name: Lint the Docker and Kubernetes files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dockerfiles (hadolint)
        run: |
          for file in gateway/Dockerfile services/*/Dockerfile tests/Dockerfile; do
            echo "Checking $file"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$file"
          done
      - name: Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary -ignore-filename-pattern '\.json$' k8s
          # the same manifests as the registry overlay (what Argo CD deploys) must be valid too
          kubectl kustomize deploy/overlays/ghcr | ./kubeconform -strict -summary
      - name: Compose file
        run: docker compose --profile monitoring --profile tools --profile backup --profile test config --quiet

  config-scan:
    name: Scan the configuration files (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Report only for now: it lists risky settings (containers that run as root, missing limits, ...)
      # so they can be fixed one by one. Change exit-code to "1" to make findings fail the build.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  build-and-test:
    name: Build the images and test the running app
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - uses: actions/checkout@v6
      - name: Build the images and start the app
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test, through the gateway
        run: docker compose --profile test run --rm smoke-test
      - name: Unit tests, inside Docker
        run: docker compose --profile test run --rm unit-tests
      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove everything
        if: always()
        run: docker compose down -v

  publish:
    name: Scan and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, calc-service, converter-service, finance-service, student-service,
                math-service, matrix-service, solver-service, history-service]
    env:
      # Pull requests and feature branches still build and scan; only main and release tags are pushed
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v6
      - name: Work out the image name and tags
        id: names
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/calculator-app/${{ matrix.image }}"
          if [ "${{ matrix.image }}" = "gateway" ]; then context=gateway; else context="services/${{ matrix.image }}"; fi
          tags="${image}:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="${tags},${image}:latest"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="${tags},${image}:${GITHUB_REF_NAME#v}"; fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "context=${context}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (kept on this runner for the scan)
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.names.outputs.context }}
          load: true
          tags: ${{ steps.names.outputs.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy report (HIGH and CRITICAL, for reading)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy gate (stop on a CRITICAL vulnerability that has a fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image (with an SBOM and build provenance)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.names.outputs.context }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

  gitops:
    name: Update the deployment in Git (Argo CD picks it up)
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Point the overlay at the images that were just pushed
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          file=deploy/overlays/ghcr/kustomization.yaml
          sed -i -E "s#ghcr.io/[A-Za-z0-9._-]+/calculator-app/#ghcr.io/${owner}/calculator-app/#; s#newTag: .*#newTag: sha-${GITHUB_SHA::7}#" "$file"
          sed -i -E "s#repoURL: .*#repoURL: https://github.com/${GITHUB_REPOSITORY}.git#" deploy/argocd/application.yaml
          kubectl kustomize deploy/overlays/ghcr > /dev/null     # the result must still build
      - name: Commit the change
        run: |
          if git diff --quiet; then echo "Nothing to change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} [skip ci]"
          git push
